            // 1 & 2. Create a recursive factorial function
      function factorial(num) {
          // Display the current value
          console.log("Current value:", num);
          // Base case
          if (num === 0) {
              return 1;
          }
          // Recursive case
          return num * factorial(num - 1);
      }
      // 3. Invoke the function
