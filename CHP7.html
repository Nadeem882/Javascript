      //properties :This is how to add properties that aren't accessible from outside. We prefix them with a # symbol:

      class Person {
        #firstname;
        #lastname;
        constructor(firstname, lastname) {
          this.#firstname = firstname;
          this.#lastname = lastname;
        }
      }
      let p = new Person("Maria", "Saga");
      console.log(p.firstname);
    //  Right now, the firstname and lastname properties cannot be accessed from outside 
//the class. This is done by adding # in front of the property. If we try it: We'll get: undefined

      //Getters and setters

      class Person {
      #firstname;
      #lastname;
      constructor(firstname, lastname) {
        this.#firstname = firstname;
        this.#lastname = lastname;
      }
      get firstname() {
        return this.#firstname;
      }
      set firstname(firstname) {
        this.#firstname = firstname;
      }
      get lastname() {
        return this.#lastname;
      }
      set lastname(lastname) {
        this.#lastname = lastname;
      }
    }
    let p = new Person("Maria", "Saga");
    console.log(p.firstname); == Maria

      class Vehicle {
    constructor(color, currentSpeed, maxSpeed) {
    this.color = color;
    this.currentSpeed = currentSpeed;
    this.maxSpeed = maxSpeed;
      }
      move() {
        console.log("moving at", this.currentSpeed);
      }
      accelerate(amount) {
        this.currentSpeed += amount;
      }
    }
      class Motorcycle extends Vehicle {

       }
    }

      {
    class Animal {
        constructor(species, sound) {
            this.species = species;
            this.sound = sound;
        }
        makeSound() {
            console.log(`${this.species} says "${this.sound}"`);
        }
    }
    
    // 2. Add a prototype method
    Animal.prototype.action = function () {
        console.log(`${this.species} is running.`);
    };
    
    // Create two animals
    let dog = new Animal("Dog", "Woof");
    let cat = new Animal("Cat", "Meow");
    dog.makeSound();
    cat.makeSound();
    
    dog.action();
    cat.action();
    
    console.log(dog);
    console.log(cat);
