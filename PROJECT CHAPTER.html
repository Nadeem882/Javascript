    /*BMI calculator
Set values for height in inches and weight in pounds, then convert the values to 
centimeters and kilos, outputting the results to the console:
• 1 inch is equal to 2.54 cm
• 2.2046 pounds is equal to 1 kilo
Output the results. Then, calculate and log the BMI: this is equal to weight (in kilos) 
divided by squared height (in meters). Output the results to the console.*/
      // Set height (in inches) and weight (in pounds)
    let heightInches = 70;
    let weightPounds = 160;
      
    let heightCm = heightInches * 2.54;
    let weightKg = weightPounds / 2.2046;
    
    let heightMeters = heightCm / 100;
    
    let bmi = weightKg / (heightMeters * heightMeters);
    console.log("Height in centimeters:", heightCm);
    console.log("Weight in kilograms:", weightKg);
    console.log("BMI:", bmi);

    /*   we'll create a Magic 8-Ball random answer generator:
1. Start by setting a variable that gets a random value assigned to it. The value 
is assigned by generating a random number 0-5, for 6 possible results. You 
can increase this number as you add more results.
2. Create a prompt that can get a string value input from a user that you can 
repeat back in the final output.
3. Create 6 responses using the switch statement, each assigned to a different 
value from the random number generator.   
4. Create a variable to hold the end response, which should be a sentence 
printed for the user. You can assign different string values for each case, 
assigning new values depending on the results from the random value.
5. Output the user's original question, plus the randomly selected case 
response, to the console after the user enters their question.  */

 // 1. Generate a random number from 0 to 5
let randomNumber = Math.floor(Math.random() * 6);
let question = prompt("Ask the Magic 8-Ball a question:");
// 3 & 4. Create a variable to hold the response
let answer;
switch (randomNumber) {
  case 0:
    answer = "Yes, definitely.";
    break;

  case 1:
    answer = "No, not at all.";
    break;

  case 2:
    answer = "Maybe. Try again later.";
    break;

  case 3:
    answer = "Without a doubt.";
    break;

  case 4:
    answer = "It is very unlikely.";
    break;

  case 5:
    answer = "The outlook is good.";
    break;

  default:
    answer = "Cannot predict now.";
}
console.log("Your Question: " + question);
console.log("Magic 8-Ball Says: " + answer);

let choices = ["Rock", "Paper", "Scissors"];
// 2. Generate random choices for the player and the computer

    result = "It's a tie!";
} 
// 5. Apply the game logic
else if (
    (player === 0 && computer === 2) || // Rock beats Scissors
    (player === 1 && computer === 0) || // Paper beats Rock
    (player === 2 && computer === 1)    // Scissors beats Paper
) {

} 
else {
