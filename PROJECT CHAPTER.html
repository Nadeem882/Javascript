    /*BMI calculator
Set values for height in inches and weight in pounds, then convert the values to 
centimeters and kilos, outputting the results to the console:
• 1 inch is equal to 2.54 cm
• 2.2046 pounds is equal to 1 kilo
Output the results. Then, calculate and log the BMI: this is equal to weight (in kilos) 
divided by squared height (in meters). Output the results to the console.*/
      // Set height (in inches) and weight (in pounds)
    let heightInches = 70;
    let weightPounds = 160;
      
    let heightCm = heightInches * 2.54;
    let weightKg = weightPounds / 2.2046;
    
    let heightMeters = heightCm / 100;
    
    let bmi = weightKg / (heightMeters * heightMeters);
    console.log("Height in centimeters:", heightCm);
    console.log("Weight in kilograms:", weightKg);
    console.log("BMI:", bmi);

/*Math multiplication table
In this project, you will create a math multiplication table using loops. You can do 
this using your own creativity or by following some of the following suggested steps:
1. Set up a blank array to contain the final multiplication table.
2. Set a value variable to specify how many values you want to multiply with 
one another and show the results for.
3. Create an outer for loop to iterate through each row and a temp array to store 
the row values. Each row will be an array of cells that will be nested into the 
final table.
4. Add an inner for loop for the column values, which will push the multiplied 
row and column values to the temp array.
5. Add the temporary row data that contains the calculated solutions to the 
main array of the final table. The final result will add a row of values for the 
calculations. */
      
    let multiplicationTable = [];
    
    // 2. Set the maximum value
    let value = 10;
    
    // 3. Create the rows
    for (let i = 1; i <= value; i++) {
    
        // Temporary array for each row
        let tempRow = [];
    
        // 4. Create the columns
        for (let j = 1; j <= value; j++) {
    
            // Multiply row and column values
            tempRow.push(i * j);
        }
    
        // 5. Add the completed row to the table
        multiplicationTable.push(tempRow);
    }
    console.log(multiplicationTable);

     /* Menu items price calculator
Create a class which will allow you to work out the combined price of a number of 
items, and interact with it to work out the total cost of different orders.
1. Create a class that contains the prices of two menu items as private field 
declarations.
2. Use the constructor in the class to get the argument values (how many of 
each item are being bought).
3. Create a method to calculate and return the total cost depending on how 
many of each item the user selects.
4. Use a getter property to grab the value output by the calculation method.
5. Create two or three objects with different combinations of menu selections, 
and output the total cost in the console. */
      
      // 1. Create a class with private fields
class Menu {
    #burgerPrice = 120;
    #pizzaPrice = 250;

    // 2. Constructor
    constructor(burgers, pizzas) {
        this.burgers = burgers;
        this.pizzas = pizzas;
    }

    // 3. Method to calculate the total cost
    calculateTotal() {
        return (this.burgers * this.#burgerPrice) +
               (this.pizzas * this.#pizzaPrice);
    }

    // 4. Getter to return the total cost
    get totalCost() {
        return this.calculateTotal();
    }
}

// 5. Create objects with different orders
let order1 = new Menu(2, 1); // 2 burgers, 1 pizza
let order2 = new Menu(1, 3); // 1 burger, 3 pizzas
let order3 = new Menu(4, 2); // 4 burgers, 2 pizzas

// Output the total cost
console.log("Order 1 Total: ₹" + order1.totalCost);
console.log("Order 2 Total: ₹" + order2.totalCost);
console.log("Order 3 Total: ₹" + order3.totalCost);
