<html>
  <body>
    <script>

      //while loops
      
      let i = 0;
      while (i < 10) {
      console.log(i);
        i++;
      }

      let nr1 = 0;
      let nr2 = 1;
      let temp;
      let fibonacciArray = [];
      while (fibonacciArray.length < 25) {
        fibonacciArray.push(nr1);
        temp = nr1 + nr2;
        nr1 = nr2;
        nr2  = temp;  
        console.log(nr1);
      }

      //do while

      let number;
      do {
        number = prompt("Please enter a number between 0 and 100: ");
      } while (!(number >= 0 && number < 100));

      practise ex5.2
      // 1. Set the starting counter to 0
      let counter = 0;
      
      // 2. Create a step variable
      let step = 10;
      
      // 3. Use a do...while loop
      do {
          console.log(counter);
          counter += step;
      } while (counter <= 100);

      //for loops
      let arr = [];
      for (let i = 0; i < 100; i+=2) {
        arr.push(i);
      }
      console.log(arr);

      practise ex 5.3
      let myWork = [];
      for (let i = 1; i <= 10; i++) {
          // 3. Alternate true/false using a ternary operator
          let status = (i % 2 === 0) ? false : true;
          // 4. Create a temporary lesson object
          let lesson = {
              name: "Lesson " + i,
              status: status
          };
          // 5. Add the object to the array
          myWork.push(lesson);
      }
      console.log(myWork);

      //nested loops
      let arrOfArrays = [];
      for (let i = 0; i < 3; i++){
        arrOfArrays.push([]);
        for (let j = 0; j < 7; j++) {
          arrOfArrays[i].push(j);
        }
      }
      console.log(arrOfArrays);

      
      let myTable = [];
      
      let rows = 4;
      let cols = 3;
      let counter = 0;
      for (let i = 0; i < rows; i++) {
      
          // Temporary array for each row
          let tempTable = [];
      
          // 5. Create columns
          for (let j = 0; j < cols; j++) {
              counter++;
              tempTable.push(counter);
          }
          // Add the completed row to the table
          myTable.push(tempTable);
      }
      console.table(myTable);
      
    </script>
